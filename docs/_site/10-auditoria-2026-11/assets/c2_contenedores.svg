<text x="840.0" y="432.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">Dockerfile multi-stage (raíz del repo):</text>
<text x="840.0" y="445.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">target "development" = runserver (docker-compose.yml) /</text>
<text x="840.0" y="458.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">target "production" = Gunicorn (docker-compose.prod.yml)</text>
