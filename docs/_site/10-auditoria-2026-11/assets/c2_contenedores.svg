<rect x="620" y="140" width="210" height="100" rx="8" ry="8" fill="#ffffff" stroke="#2c3e50" stroke-width="1.8"/>
<text x="725.0" y="160.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a" font-family="Segoe UI, Arial, sans-serif">Nginx</text>
<text x="725.0" y="199.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Proxy inverso</text>
<text x="725.0" y="212.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Nginx 1.24</text>
