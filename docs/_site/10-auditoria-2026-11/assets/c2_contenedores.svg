<text x="405.0" y="367.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">React + TypeScript + Vite</text>
<text x="405.0" y="380.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">login, dashboard, solicitud,</text>
