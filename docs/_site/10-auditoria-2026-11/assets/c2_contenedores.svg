<text x="135.0" y="367.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Estudiante, Secretaría,</text>
<text x="135.0" y="380.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Secretario-Abogado, Decano,</text>
<text x="135.0" y="393.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Director, Responsable, Admin</text>
