<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 740" width="1480" height="740" font-family="Segoe UI, Arial, sans-serif">
<title>C2 — Diagrama de Contenedores — SGT-SIAAF</title>
<rect width="1480" height="740" fill="#ffffff"/>
