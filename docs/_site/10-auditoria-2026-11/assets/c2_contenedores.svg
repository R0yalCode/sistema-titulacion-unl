<text x="1310.0" y="349.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Volumen Docker</text>
<text x="1310.0" y="362.2" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Sin URL pública (PrivateMediaStorage)</text>
