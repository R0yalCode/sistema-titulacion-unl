<text x="690.0" y="432.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">Plataforma de gestión del trámite</text>
<text x="690.0" y="445.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">de Declaratoria de Aptitud Legal</text>
<text x="690.0" y="458.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#e3f2fd" font-family="Segoe UI, Arial, sans-serif">(Art. 235 RRA-UNL)</text>
<rect x="1080" y="150" width="440" height="190" rx="8" ry="8" fill="#fff2cc" stroke="#b38f00" stroke-width="1.8"/>
<text x="1300.0" y="170.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a" font-family="Segoe UI, Arial, sans-serif">SGA/SIAAF institucional (simulado)</text>
<text x="1300.0" y="247.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">Adaptador mock de solo lectura;</text>
<text x="1300.0" y="260.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">una sola interfaz (ISGALegacyPort),</text>
<text x="1300.0" y="273.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">no dos sistemas separados en el código</text>
