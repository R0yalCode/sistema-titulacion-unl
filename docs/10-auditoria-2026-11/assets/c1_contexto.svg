<text x="1300.0" y="697.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">No integrado al sistema.</text>
<text x="1300.0" y="710.7" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" font-family="Segoe UI, Arial, sans-serif">El memorando se firma fuera y</text>
