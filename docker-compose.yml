services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgt_siaaf}
      POSTGRES_USER: ${POSTGRES_USER:-sgt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-sgt_siaaf}
      DB_USER: ${POSTGRES_USER:-sgt_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
    networks:
      - backend_net

  # Punto de acceso único (http://localhost:8000): sirve el frontend React
  # compilado dentro de la imagen y envía /api/, /admin/, /health/, /static/ y
  # /media/ a Django. Ver nginx/nginx.conf y frontend/Dockerfile.
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      # Montado para editarlo en desarrollo. Tras editarlo: `docker compose
      # restart nginx` (un archivo montado suelto conserva el inodo antiguo).
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  static_data:
