# Nginx de desarrollo (docker-compose.yml). Punto de acceso único en
# http://localhost:8000:
#   - Frontend React/Vite compilado en la imagen (frontend/Dockerfile),
#     servido desde /usr/share/nginx/html, con fallback a index.html para las
#     rutas de React Router.
#   - Backend Django (backend:8000) para /api/, /admin/, /health/, /static/ y
#     /media/.
# Producción usa nginx/prod.conf.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 15M;

    # Redirecciones relativas: con absolutas, Nginx usaría su puerto interno (80)
    # en lugar del publicado (8000) y `/admin` llevaría a http://localhost/admin/.
    absolute_redirect off;

    # DNS interno de Docker: resuelve `backend` en cada petición, así Nginx
    # arranca aunque el backend todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Backend Django -----------------------------------------------------

    # API REST, Swagger (/api/v1/docs/), ReDoc (/api/v1/redoc/) y esquema.
    location ^~ /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consola de administración de Django (`/admin` sin barra también va a Django).
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Comprobación de salud.
    location = /health/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos de Django (CSS/JS del admin y de Swagger). En desarrollo los
    # sirve `runserver` (DEBUG), así que se reenvían al backend.
    location ^~ /static/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
    }

    # /media/ se reenvía a Django y NO se sirve desde el volumen `media_data`:
    # los PDF del trámite son privados y solo se entregan por la API, con
    # autenticación, RBAC y verificación SHA-256. Django no publica /media/,
    # así que responde 404.
    location ^~ /media/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
    }

    # --- Frontend React -----------------------------------------------------

    # Recursos compilados con hash en el nombre: caché larga. Si no existen,
    # 404 (no el index.html, que se haría pasar por JS o CSS).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html no se cachea: tras recompilar, el navegador recibe las nuevas
    # referencias a /assets/.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: cualquier otra ruta sirve index.html (navegación directa y
    # recarga en rutas internas como /login o /bandeja/<id>).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
