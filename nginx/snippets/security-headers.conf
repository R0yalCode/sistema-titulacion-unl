# Cabeceras de las respuestas que entrega Nginx sin pasar por Django. Replican
# los valores de config/settings/production.py. No se incluyen en las rutas
# reenviadas al backend para no duplicarlas.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;
