# Nginx de producción (SEC-T001). Vive junto a nginx.conf (desarrollo).
#
# IMPORTANTE: /etc/nginx/certs/fullchain.pem y privkey.pem son puntos de
# montaje, NO certificados incluidos en este repositorio. Quien despliegue
# debe proveer certificados reales (p. ej. Let's Encrypt/Certbot o la PKI
# institucional de la UNL) y montarlos en ./nginx/certs/ antes de levantar
# este servicio. Sin esos archivos, Nginx no arrancará.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 15M;
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Backend Django -----------------------------------------------------

    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /health/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # --- Archivos ---------------------------------------------------------

    # Estáticos de Django, generados por collectstatic en el volumen compartido.
    location ^~ /static/ {
        alias /var/www/static/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Los documentos son privados: solo se entregan por la API, con
    # autenticación, RBAC y verificación SHA-256.
    location ^~ /media/ {
        return 404;
    }

    # --- Frontend React -----------------------------------------------------

    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # React Router: las rutas internas sirven index.html.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
