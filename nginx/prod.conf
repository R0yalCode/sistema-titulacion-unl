# Nginx de producción (SEC-T001). Vive junto a nginx.conf (desarrollo).
#
# IMPORTANTE: /etc/nginx/certs/fullchain.pem y privkey.pem son puntos de
# montaje, NO certificados incluidos en este repositorio. Quien despliegue
# debe proveer certificados reales (p. ej. Let's Encrypt/Certbot o la PKI
# institucional de la UNL) y montarlos en ./nginx/certs/ antes de levantar
# este servicio. Sin esos archivos, Nginx no arrancará.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 15M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
